name: Code static analysis
on:
  push:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # ratchet:actions/checkout@v3
      - name: Install poetry
        run: pip install poetry
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # ratchet:actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: "poetry"
          cache-dependency-path: "pyproject.toml"
      - name: Install dependencies
        run: make poetry
      - name: Run acceptance check
        run: make -k commit-acceptance
